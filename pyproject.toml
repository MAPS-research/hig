[project]
name = "hig"
version = "0.1.0"
description = "Histogram-constrained Image Generation: training-free distributional control for diffusion models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    "torch>=2.5.1",        # diffusers 0.35 needs sdpa(enable_gqa=) (2.5+); 2.5.0 has a cuDNN conv bug
    "diffusers>=0.35",
    "transformers>=4.56",  # first release with the `dtype=` kwarg on from_pretrained
    "accelerate>=1.0",
    "safetensors>=0.4",
    "pot>=0.9.4",          # network-simplex OT solver
    "numpy>=1.26",
    "pillow>=10.0",
    "tqdm>=4.66",
    "sentencepiece>=0.2",  # T5 tokenizer (FLUX text encoder 2)
    "protobuf>=4.25",
]

[project.optional-dependencies]
metrics = [
    "torchvision>=0.20.1",    # pairs with torch 2.5.1
    "open-clip-torch>=2.24",  # LAION aesthetic predictor backbone
]
compose = [
    "peft>=0.17",                   # diffusers needs it to load LoRA weights (0.35 requires >=0.17)
    "opencv-python-headless>=4.9",  # Canny edges for the ControlNet demo
]

[project.scripts]
hig-color = "hig.cli.color:main"
hig-embed = "hig.cli.embed:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hig"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: requires a CUDA device",
    "slow: pulls a full-size backbone checkpoint",
]
